[project]
name = "pricescraping-orchestrator"
version = "0.1.0"
description = "Dashboard + orchestration panel for the price-scraping platform: schedules jobs onto the queue, provisions worker nodes, ingests and stores results."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "apscheduler==3.11.0",
    "croniter==3.0.4",
    "redis==5.2.1",
    "httpx==0.28.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "docker==7.1.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "fakeredis==2.26.2",
    "respx==0.22.0",
    "ruff==0.9.4",
]

[project.scripts]
pricescraping-orchestrator = "orchestrator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "orchestrator",
    "orchestrator.api",
    "orchestrator.provisioning",
    "orchestrator.ui",
]

[tool.setuptools.package-data]
"orchestrator.ui" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
